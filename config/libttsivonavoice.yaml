# Compiler flags for libttsivonavoice.so: NDK r10e arm-linux-androideabi-4.8 armeabi defaults.
# Calibrated 2026-10-22: ARM = -marm -O2 WITHOUT -mtune=xscale (xscale suppresses conditional
# returns like `popeq {r4,pc}`; verified on tts_dict_cleanup, FUN_0003dcf0); -Os/-O1 fail on the
# loop in FUN_00036a3c. Engine core: -fno-stack-protector (no canaries even with 256-byte buffers;
# only the thumb android_syslog wrapper uses __stack_chk_guard) and -fsigned-char (ldrsb on char
# tests, tts_errmsg). Thumb flags not yet calibrated on this binary.
default_mode: arm  # mode for TUs whose functions are not known yet
toolchain: r10e   # NDK whose GCC 4.8 builds this binary (image localhost/ivona-ndk:<ver>)
flags:
  common: [-fpic, -ffunction-sections, -funwind-tables, -fno-stack-protector, -fsigned-char, -no-canonical-prefixes,
           -march=armv5te, -msoft-float, -fomit-frame-pointer, -DNDEBUG,
           -I/opt/sysroot/usr/include, -Iinclude, -Iinclude/flite]
  thumb: [-mthumb, -mtune=xscale, -Os, -fno-strict-aliasing, -finline-limit=64]
  arm: [-marm, -O2, -fstrict-aliasing, -funswitch-loops, -finline-limit=300]
  c: [-std=gnu99]
  cxx: [-fno-exceptions, -fno-rtti, -I/opt/gnustl/include, -I/opt/gnustl/libs/armeabi/include]
# Per-translation-unit overrides:  src/libtiver/foo.c: {mode: arm, add: [-O3], remove: [-O2]}
units:
  # Thumb C++ wrapper TUs at the start of .text: NDK default -fstack-protector (android_syslog
  # checks __stack_chk_guard), unlike the ARM core.
  src/libttsivonavoice/ivona_ext.cpp: {mode: thumb, add: [-fstack-protector], remove: [-fno-stack-protector]}
  src/libttsivonavoice/android_log.cpp: {mode: thumb, add: [-fstack-protector], remove: [-fno-stack-protector]}
  src/libttsivonavoice/ivona_api.cpp: {mode: thumb, add: [-fstack-protector], remove: [-fno-stack-protector]}
  # -O3: stack slot layout of cst_wave_load_riff_fd only matches at -O3
  src/libttsivonavoice/flite/cst_wave_io.c: {add: [-O3], remove: [-O2]}
  # -O3: ivona_crc32's 8-step table loop is completely unrolled (only -O3 peels it); every other
  # function of the TU compiles identically at -O2 and -O3
  src/libttsivonavoice/textstream.c: {add: [-O3], remove: [-O2]}
  # -fno-inline: val_delete_float_ptr tail-calls a one-instruction delete_float_ptr and
  # phone_acoustic_data_init calls a `return 0` stub; nothing in this TU is inlined
  src/libttsivonavoice/acoustic.c: {add: [-fno-inline]}
  # -fno-inline: val_delete_diphonedb tail-calls delete_diphonedb and every small helper
  # (vox_decoder_free, vox_db_free) is called, never inlined
  src/libttsivonavoice/voxdb.c: {add: [-fno-inline]}
  # -fno-inline: val_delete_track tail-calls delete_track, copy_track calls new_track
  src/libttsivonavoice/track.c: {add: [-fno-inline]}
  # -O3 -fno-inline-functions: item_traverse_op's lookup loop is completely unrolled (only
  # -O3's early cunrolli does that) while item_feat_func stays out of line in ffeature_*
  src/libttsivonavoice/flite/cst_ffeature.c: {add: [-O3, -fno-inline-functions], remove: [-O2]}
