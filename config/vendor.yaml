# Third-party code statically linked into libttsivonavoice, built from pinned upstream releases
# (external/fetch.sh) by `dc vendor build LIB` into build/libobj/LIB.a for `dc libmatch`.
openssl:
  # OpenSSL 1.0.2h libcrypto only (no libssl strings in the engine). Calibrated 2026-10-22 on
  # stack.c/lhash.c/x509_cmp.c (sk_dup at 0xf086c): unoptimized ARM with a frame pointer.
  # Defines are CFLAG of `Configure android` (no asm modules: no CRYPTOGAMS banners in .rodata).
  binaries: [libttsivonavoice]  # libmatch offers it only to these (tiny wrappers collide elsewhere)
  src: external/openssl-1.0.2h
  prepare: openssl
  # The original tree was .../build/arm-android-fireos/openssl-1.0.2h-rsa (OPENSSLDIR strings).
  # no-err: ERR_put_error gets NULL, 0 (BN_new at 0xed050); no-engine: no ENGINE_finish in
  # RAND_set_rand_method (0xf23ac); no-dsa/dh/ec*: 4 standard EVP_PKEY_ASN1 methods
  # (EVP_PKEY_asn1_get_count at 0x148a5c), no Suite B body in X509_CRL_check_suiteb.
  configure: [android, no-shared, no-err, no-engine, no-dsa, no-dh, no-ec, no-ecdh, no-ecdsa,
              --prefix=/ivona-pd/jenkins/jobs/ext-core/workspace/build/arm-android-fireos/openssl-1.0.2h-rsa]
  undef: [BN_LLONG]  # BN_mod_word (0x12700c) has no long long arithmetic
  remove: [-fsigned-char]  # plain char is unsigned (no sign extension in lh_strhash at 0xf2284)
  sources: openssl-libcrypto
  flags: [-marm, -O0, -fno-omit-frame-pointer, -DOPENSSL_THREADS, -D_REENTRANT, -DDSO_DLFCN, -DHAVE_DLFCN_H]
curl:
  # libcurl 7.52.1 (block from ~0x1cb000; curl_global_init at 0x1cba38). Calibrated 2026-10-22 on
  # easy.c/url.c/http.c: the engine's ARM -O2 flags, but plain char unsigned. No SSL or zlib.
  binaries: [libttsivonavoice]
  src: external/curl-7.52.1
  prepare: autoconf
  config_h: lib/curl_config.h
  # --disable-ipv6: global_init, inlined into curl_easy_init (0x1cbbf8), calls no Curl_ipv6works;
  # --disable-crypto-auth: Curl_close (0x1da15c) has no Curl_digest_cleanup call, no nonce/realm
  # strings; unix sockets stay enabled (their dupstring slot replaces STRING_SERVICE_NAME, so
  # Curl_failf finds state.buffer at 0x61c and Curl_close set.wildcardmatch at 0x46c);
  # cookies: Curl_close calls no Curl_flush_cookies and there are no Set-Cookie strings; proxy:
  # no SOCKS strings at all; ftp/telnet/tftp/smb: their scheme names are missing from .rodata
  # (DICT FILE GOPHER HTTP IMAP POP3 RTSP SMTP remain).
  configure: [--disable-shared, --enable-static, --disable-ipv6, --disable-crypto-auth,
              --disable-cookies, --disable-proxy, --disable-ftp,
              --disable-telnet, --disable-tftp, --disable-smb, --without-ssl, --without-zlib, --without-libidn2,
              --without-libpsl, --without-librtmp, --without-libssh2, --without-nghttp2,
              --without-gssapi, --without-ca-bundle, --without-ca-path]
  sources: curl-lib
  remove: [-fsigned-char]
  flags: [-marm, -O2, -fstrict-aliasing, -funswitch-loops, -finline-limit=300]  # the engine's ARM flags
pcre:
  # PCRE 8.37: its compile-error table ends at ERR86 "digits missing in \x{} or \o{}" (0x22809c),
  # as in 8.37 only. Unoptimized ARM with a frame pointer like OpenSSL (find_error_text at 0x72148).
  # UTF + Unicode properties: pcre_compile's .rodata has the \p{Nd} posix_substitutes before
  # error_texts (0x228014); the "compiled without ... support" texts are always in the table.
  binaries: [libttsivonavoice]
  src: external/pcre-8.37
  prepare: autoconf
  config_h: config.h
  configure: [--disable-shared, --enable-static, --disable-cpp, --enable-utf, --enable-unicode-properties]
  sources: pcre
  remove: [-fsigned-char]
  flags: [-marm, -O0, -fno-omit-frame-pointer]
expat:
  # Expat 2.2.0 ("expat_2.2.0" from XML_ExpatVersion at 0x1a21d0). Unoptimized ARM with a frame
  # pointer, asserts compiled in ("lib/xmlparse.c" is referenced), so no -DNDEBUG.
  binaries: [libttsivonavoice]
  src: external/expat-2.2.0
  prepare: autoconf
  config_h: expat_config.h
  configure: [--disable-shared, --enable-static]
  sources: expat
  remove: [-fsigned-char, -DNDEBUG]
  flags: [-marm, -O0, -fno-omit-frame-pointer]
silk:
  # SILK SDK 1.0.8 fixed-point decoder: vox codec 14, used by the Android voices
  # (docs/notes/vox-codecs.md). The engine's ARM flags but -O3, as in the SDK's Makefile: at -O2
  # SKP_Silk_lin2log (0x204448), SKP_Silk_biquad and SKP_Silk_CNG_Reset differ in inlining.
  binaries: [libttsivonavoice]
  src: external/silk-sdk-fix-1.0.8
  sources: silk
  flags: [-marm, -O3, -fstrict-aliasing, -funswitch-loops, -finline-limit=300]  # SDK Makefile: -O3
