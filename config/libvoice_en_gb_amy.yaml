# Compiler flags for libvoice_en_gb_amy.so: NDK r10e arm-linux-androideabi-4.8 armeabi defaults.
# Hypothesis (2026-10-22): built like the engine core (its embedded Flite has the same IVONA
# changes), so the engine's calibrated flags; to be confirmed by matches.
default_mode: arm  # mode for TUs whose functions are not known yet
toolchain: r10e   # NDK whose GCC 4.8 builds this binary (image localhost/ivona-ndk:<ver>)
flags:
  common: [-fpic, -ffunction-sections, -funwind-tables, -fno-stack-protector, -fsigned-char, -no-canonical-prefixes,
           -march=armv5te, -msoft-float, -fomit-frame-pointer, -DNDEBUG,
           -I/opt/sysroot/usr/include, -Iinclude, -Iinclude/flite]
  thumb: [-mthumb, -mtune=xscale, -Os, -fno-strict-aliasing, -finline-limit=64]
  arm: [-marm, -O2, -fstrict-aliasing, -funswitch-loops, -finline-limit=300]
  c: [-std=gnu99]
  cxx: [-fno-exceptions, -fno-rtti, -I/opt/gnustl/include, -I/opt/gnustl/libs/armeabi/include]
# Per-translation-unit overrides:  src/libtiver/foo.c: {mode: arm, add: [-O3], remove: [-O2]}
units:
  src/libttsivonavoice/flite/cst_val_const.c: {add: [-DVAL_STRING_CONST_FIRST]}
  # The voice library's copy of the engine's wavesynth.c is built like the engine's (see
  # config/libttsivonavoice.yaml): -fno-inline, -fno-strict-aliasing, and OpenSSL headers for HMAC.
  src/libttsivonavoice/wavesynth.c: {add: [-fno-inline, -fno-strict-aliasing, -Ibuild/vendor/openssl-1.0.2h/include], remove: [-fstrict-aliasing]}
